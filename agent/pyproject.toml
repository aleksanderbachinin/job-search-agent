[project]
name = "jobagent"
version = "0.1.0"
description = "Агент отбора вакансий Hirify с карточками в Telegram"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "aiogram>=3.13",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "tests"]
